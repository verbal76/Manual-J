name: Android debug build
# DEVELOPMENT build only. Artifacts here are NOT delivered versions and carry no public vN (see docs/RELEASING.md).
on:
  push:
    branches: ['**']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_SHA: ${{ github.sha }}
      SIGNING_STATE: DEBUG
      BUILD_TYPE: debug
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name APK with commit
        run: cp android/app/build/outputs/apk/debug/app-debug.apk manual-j-dev-run${{ github.run_number }}-${GITHUB_SHA::7}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: manual-j-dev-apk
          path: manual-j-dev-*.apk
