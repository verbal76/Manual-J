<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000"><title>Manual J Survey</title>
<!-- Hot Attic Games studio card (opaque dark card; only the logo fades in, so the app below never shows through). Static markup so it is the very first thing painted on a cold launch (no blank frame).
     Artwork: the canonical Hot_Attic_Games_Master_Logo_ALPHA_FINAL.png, used unmodified (transparent PNG, contain-fit). -->
<style>
html{background:#000}
#hag-splash{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
  padding:max(4vmin,env(safe-area-inset-top)) max(4vmin,env(safe-area-inset-right)) max(4vmin,env(safe-area-inset-bottom)) max(4vmin,env(safe-area-inset-left));
  background:radial-gradient(ellipse at 50% 55%,#2a1007 0%,#120704 55%,#000 100%)}
#hag-splash img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;opacity:0;animation:hag-in 450ms ease-out forwards}
#hag-splash.out{opacity:0;transition:opacity 500ms ease-in}
@keyframes hag-in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#hag-splash img{animation:none;opacity:1}#hag-splash.out{transition:none}}
</style></head>
<body><div id="hag-splash" aria-label="Hot Attic Games"><img id="hag-logo" alt="Hot Attic Games" src="/Hot_Attic_Games_Master_Logo_ALPHA_FINAL.png" decoding="async"></div>
<div id="app"></div><script type="module" src="/src/main.ts"></script></body></html>
